<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ตามหารักแท้ คำคล้องจอง</title>
<link href="https://fonts.googleapis.com/css2?family=Mali:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg1:#ffd9ec;--bg2:#e6d9ff;--panel:rgba(255,255,255,.88);--ink:#4a2c5e;--pink:#ff4f93;--pur:#8a5cf6;--ok:#e63b7a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#3a1535;--bg2:#241a4d;--panel:rgba(50,28,70,.9);--ink:#ffeefa;--pink:#ff7fb5;--pur:#b99bff;--ok:#ff7fb5}}
:root[data-theme="dark"]{--bg1:#3a1535;--bg2:#241a4d;--panel:rgba(50,28,70,.9);--ink:#ffeefa;--pink:#ff7fb5;--pur:#b99bff;--ok:#ff7fb5}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;color:var(--ink);font-family:'Mali','Sarabun',sans-serif}
body{background:linear-gradient(170deg,var(--bg1),var(--bg2)) fixed;overflow-x:hidden}
.fh{position:fixed;bottom:-50px;pointer-events:none;animation:rise linear infinite;opacity:.55;z-index:0}
@keyframes rise{to{transform:translateY(-115vh) rotate(30deg)}}
main{position:relative;z-index:1;max-width:900px;margin:0 auto;padding:12px 14px 40px;display:flex;flex-direction:column;align-items:center;gap:12px}
h1{margin:4px 0 0;font-size:clamp(28px,6.5vw,50px);color:var(--pink);text-align:center;text-shadow:0 3px 0 rgba(255,255,255,.5)}
h1 i{display:inline-block;font-style:normal;animation:beat 1s infinite}
@keyframes beat{50%{transform:scale(1.25)}}
.bar{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;align-items:center}
.pill{background:var(--panel);border-radius:999px;padding:4px 14px;font-weight:700;font-size:clamp(15px,2.8vw,20px)}
.btn{font:inherit;font-weight:700;border:0;border-radius:999px;padding:6px 16px;background:var(--pur);color:#fff;cursor:pointer;font-size:clamp(15px,2.8vw,20px);box-shadow:0 4px 0 rgba(0,0,0,.15)}
#meter{width:min(520px,92%);height:20px;background:var(--panel);border-radius:99px;overflow:hidden}
#fill{height:100%;width:0;background:linear-gradient(90deg,#ff9ac6,#ff3d85);transition:width .8s;border-radius:99px}
#cupid{display:flex;align-items:center;gap:10px;font-size:clamp(18px,3.6vw,26px);font-weight:700}
#cupid .c{font-size:clamp(44px,10vw,70px);animation:bob 2s infinite}
@keyframes bob{50%{transform:translateY(-8px) rotate(-8deg)}}
#bub{background:var(--panel);border-radius:22px;padding:8px 16px;position:relative}
#sk{background:var(--panel);border:5px solid var(--pink);border-radius:34px;padding:10px 26px;text-align:center;animation:bob 3s infinite;box-shadow:0 8px 0 rgba(255,79,147,.3)}
#sk small{display:block;font-size:clamp(15px,3vw,20px);font-weight:600}
#sk .e{font-size:clamp(54px,13vw,92px);line-height:1.1;display:block}#sk .w{font-size:clamp(34px,8vw,56px);font-weight:700}
#opts{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.opt{position:relative;font:inherit;cursor:pointer;color:var(--ink);background:var(--panel);border:4px solid var(--pur);border-radius:28px;padding:10px 12px;min-width:clamp(96px,27vw,160px);display:flex;flex-direction:column;align-items:center;animation:pin .5s backwards;box-shadow:0 6px 0 rgba(0,0,0,.15)}
.opt .t{font-size:clamp(13px,2.4vw,16px);font-weight:600;color:var(--pur)}
.opt .e{font-size:clamp(40px,10vw,62px);line-height:1.1}.opt .w{font-size:clamp(26px,6vw,40px);font-weight:700}
.opt:hover{transform:translateY(-4px) rotate(-2deg)}
.opt.no{animation:sh .4s;opacity:.4;border-color:#999;cursor:default}
.opt.no::after{content:"💔";position:absolute;top:-14px;right:-6px;font-size:34px}
.opt.yes{border-color:var(--ok);transform:scale(1.1);box-shadow:0 0 0 6px rgba(255,79,147,.35)}
@keyframes pin{from{transform:scale(.2) rotate(-15deg);opacity:0}}
@keyframes sh{25%{transform:translateX(-9px)}75%{transform:translateX(9px)}}
#garden{width:100%;background:var(--panel);border-radius:26px;padding:10px;min-height:90px;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center}
#garden p{margin:0;font-weight:700;width:100%;text-align:center;font-size:clamp(15px,2.8vw,19px)}
.cp{background:linear-gradient(#ffe3f0,#f0e3ff);color:#4a2c5e;border-radius:18px;padding:4px 12px;font-weight:700;font-size:clamp(17px,3.2vw,24px);animation:pin .6s}
#match{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;background:rgba(80,10,60,.55);z-index:5;text-align:center;color:#fff}
#match .h{font-size:clamp(110px,30vw,220px);animation:beat .6s infinite}
#match b{font-size:clamp(30px,8vw,56px)}#match span{font-size:clamp(28px,7vw,48px)}
#end{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(60,10,60,.6);z-index:6;padding:16px}
#card{background:var(--panel);border-radius:34px;padding:20px;text-align:center;max-width:560px;width:100%;max-height:92svh;overflow:auto}
#card h2{margin:0;color:var(--pink);font-size:clamp(26px,6vw,40px)}#hs{font-size:clamp(34px,9vw,56px)}
#list{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:10px 0;font-size:clamp(17px,3.3vw,24px);font-weight:600}
.fall{position:fixed;top:-60px;font-size:34px;pointer-events:none;animation:fall linear forwards;z-index:9}
@keyframes fall{to{transform:translateY(115vh) rotate(540deg)}}
</style>
</head>
<body>
<main>
<h1><i>💘</i> ตามหารักแท้ <i>💘</i></h1>
<div class="bar"><span class="pill">💞 เจอรักแท้ <span id="dn">0</span>/6</span><span class="pill">💔 <span id="ms">0</span></span><button class="btn" id="snd">🔊</button><button class="btn" id="mic" style="display:none;background:var(--pink)">🎤 พูดตอบ</button></div>
<div id="meter"><div id="fill"></div></div>
<div id="cupid"><span class="c">🧚</span><div id="bub"></div></div>
<div id="sk"></div>
<div id="opts"></div>
<div id="garden"><p>💒 ทะเบียนคู่รักแท้</p></div>
</main>
<div id="match"><div class="h">💘</div><b>รักแท้!</b><span id="mw"></span></div>
<div id="end"><div id="card"><h2>💒 งานแต่งใหญ่!</h2><div id="hs"></div><p style="margin:4px 0;font-size:clamp(17px,3vw,22px)">คู่รักแท้ทั้งหมด ช่วยกันอ่านออกเสียงนะ</p><div id="list"></div><button class="btn" id="again" style="background:var(--pink)">💘 หารักแท้รอบใหม่</button></div></div>
<script>
var PAIRS=[["กา","มา"],["บ้าน","ทาน"],["แมว","แจว"],["ปลา","ตา"],["หมู","งู"],["ไข่","ไก่"],["หู","ดู"],["เสือ","เรือ"],["มือ","ถือ"],["แกะ","แพะ"],["นม","ลม"]];
var EM={"กา":"🐦‍⬛","มา":"🐴","บ้าน":"🏠","ทาน":"🍽️","แมว":"🐱","แจว":"🛶","ปลา":"🐟","ตา":"👁️","หมู":"🐷","งู":"🐍","ไข่":"🥚","ไก่":"🐔","หู":"👂","ดู":"👀","เสือ":"🐯","เรือ":"⛵","มือ":"✋","ถือ":"👜","แกะ":"🐑","แพะ":"🐐","นม":"🍼","ลม":"💨"};
var GOOD=["ใช่เลย! ใจตรงกัน 💘","เสียงท้ายเหมือนกันเป๊ะ! 💞","คู่นี้แหละรักแท้ 💖"],BAD=["ยังไม่ใช่รักแท้ 💔 ฟังเสียงท้ายอีกที","ไม่ใช่คนนี้นะ หาต่อน้า 🥺"];
var N=6,Q,idx,done,miss,q,lock,sound=true,ac;
var $=function(i){return document.getElementById(i)},opts=$('opts');
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}
function pick(a){return a[Math.floor(Math.random()*a.length)]}
function say(t){if(!sound)return;try{var u=new SpeechSynthesisUtterance(t);u.lang='th-TH';u.rate=.8;speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}
function tone(f,d,at){if(!sound)return;try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();var o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime+(at||0);o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(.18,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+d)}catch(e){}}
function chime(){[660,830,990,1320].forEach(function(f,i){tone(f,.35,i*.12)})}
function confetti(n){var s=['💖','💘','💞','🌸','✨','🎀','💗'];for(var i=0;i<n;i++){var d=document.createElement('div');d.className='fall';d.textContent=pick(s);d.style.left=Math.random()*100+'vw';d.style.animationDuration=(2+Math.random()*2)+'s';d.style.animationDelay=Math.random()*.6+'s';document.body.appendChild(d);setTimeout(function(x){x.remove()},5000,d)}}
for(var i=0;i<16;i++){var h=document.createElement('span');h.className='fh';h.textContent=pick(['💗','💕','💖','🌸']);h.style.left=Math.random()*100+'vw';h.style.fontSize=(18+Math.random()*28)+'px';h.style.animationDuration=(9+Math.random()*10)+'s';h.style.animationDelay=(-Math.random()*15)+'s';document.body.appendChild(h)}
function start(){
 Q=shuffle(PAIRS).slice(0,N).map(function(p){var f=Math.random()<.5;return{q:p[f?0:1],a:p[f?1:0],p:p}});
 idx=0;done=0;miss=0;lock=false;$('dn').textContent=0;$('ms').textContent=0;$('fill').style.width='0';$('end').style.display='none';
 $('garden').innerHTML='<p>💒 ทะเบียนคู่รักแท้</p>';ask()}
function ask(){
 q=Q[idx];$('sk').innerHTML='<small>💭 ใครน้า รักแท้ของฉัน</small><span class="e">'+EM[q.q]+'</span><span class="w">'+q.q+'</span>';
 $('bub').textContent='ช่วยหารักแท้ให้ “'+q.q+'” หน่อย เสียงท้ายต้องเหมือนกันนะ!';
 var pool=[];PAIRS.forEach(function(p){if(p!==q.p)pool=pool.concat(p)});
 var o=shuffle(shuffle(pool).slice(0,2).concat([q.a]));opts.innerHTML='';
 o.forEach(function(w,k){var b=document.createElement('button');b.className='opt';b.dataset.w=w;b.style.animationDelay=k*.12+'s';
  b.innerHTML='<span class="t">ผู้สมัครคนที่ '+(k+1)+'</span><span class="e">'+EM[w]+'</span><span class="w">'+w+'</span>';b.onclick=function(){choose(b)};opts.appendChild(b)});
 say(q.q)}
function choose(b){
 if(lock||b.classList.contains('no'))return;say(b.dataset.w);
 if(b.dataset.w!==q.a){miss++;$('ms').textContent=miss;b.classList.add('no');$('bub').textContent=pick(BAD);tone(260,.3);return}
 lock=true;b.classList.add('yes');done++;$('dn').textContent=done;$('fill').style.width=(done/N*100)+'%';$('bub').textContent=pick(GOOD);
 chime();$('mw').textContent=EM[q.q]+' '+q.q+' 💞 '+q.a+' '+EM[q.a];setTimeout(function(){$('match').style.display='flex';confetti(18)},350);
 setTimeout(function(){$('match').style.display='none';var c=document.createElement('div');c.className='cp';c.textContent=EM[q.q]+q.q+' 💞 '+q.a+EM[q.a];$('garden').appendChild(c);
  idx++;lock=false;if(idx<N)ask();else finish()},2100)}
function finish(){
 opts.innerHTML='';$('sk').innerHTML='<span class="e">💒</span>';$('bub').textContent='ครบทุกคู่แล้ว ยินดีด้วย!';confetti(50);
 var n=miss<=1?3:miss<=4?2:1;$('hs').textContent='💖'.repeat(n)+'🤍'.repeat(3-n);
 var l=$('list');l.innerHTML='';Q.forEach(function(x){var d=document.createElement('div');d.textContent=EM[x.p[0]]+x.p[0]+' 💞 '+x.p[1]+EM[x.p[1]];l.appendChild(d)});
 setTimeout(function(){$('end').style.display='flex'},900)}
$('again').onclick=start;
$('snd').onclick=function(){sound=!sound;this.textContent=sound?'🔊':'🔇'};
var SR=window.SpeechRecognition||window.webkitSpeechRecognition;
if(SR){$('mic').style.display='';$('mic').onclick=function(){if(lock)return;try{var r=new SR();r.lang='th-TH';r.onresult=function(e){var t=e.results[0][0].transcript;
 if(t.indexOf(q.a)>-1){[].forEach.call(opts.children,function(b){if(b.dataset.w===q.a)choose(b)})}else $('bub').textContent='ได้ยินว่า “'+t+'” ลองพูดอีกครั้งนะ 🎤'};
 r.onerror=function(){$('bub').textContent='ไมค์ใช้ไม่ได้ ลองแตะแทนนะ'};$('bub').textContent='🎤 พูดชื่อรักแท้ได้เลย';r.start()}catch(e){}}}
start();
</script>
</body>
</html>
